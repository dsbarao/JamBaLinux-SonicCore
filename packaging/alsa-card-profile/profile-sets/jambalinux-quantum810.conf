# Instalado pelo JamBaLinux SonicCore (overlay ACP do usuário).
#
# Mesmos mappings e perfis do usb-gaming-headset-gamefirst.conf upstream, com
# uma correção: no JBL Quantum 810 Wireless o controle de hardware do PCM 0
# (Game) é o elemento "PCM" e o do PCM 1 (Chat) é "PCM,1". O upstream liga o
# sink Game ao elemento PCM,1, então o volume Game mexe no Chat e o PCM 0 fica
# preso no último valor salvo. Os nomes de mapping e de perfil são mantidos para
# que nós, rotas e perfis salvos continuem iguais.

[General]
auto-profiles = yes

[Mapping mono-chat-output]
description-key = gaming-headset-chat
device-strings = hw:%f,1,0
channel-map = mono
paths-output = jambalinux-quantum810-chat-mono
intended-roles = phone

[Mapping stereo-chat-output]
description-key = gaming-headset-chat
device-strings = hw:%f,1,0
channel-map = left,right
paths-output = jambalinux-quantum810-chat
intended-roles = phone

[Mapping mono-chat-input]
description-key = gaming-headset-chat
device-strings = hw:%f,0,0
channel-map = mono
paths-input = usb-gaming-headset-input
intended-roles = phone

[Mapping stereo-game-output]
description-key = gaming-headset-game
device-strings = hw:%f,0,0
channel-map = left,right
paths-output = jambalinux-quantum810-game
direction = output

[Profile output:mono-chat+output:stereo-game+input:mono-chat]
output-mappings = mono-chat-output stereo-game-output
input-mappings = mono-chat-input
priority = 5100

[Profile output:stereo-game+output:stereo-chat+input:mono-chat]
output-mappings = stereo-game-output stereo-chat-output
input-mappings = mono-chat-input
priority = 5100
