<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- JamBaLinux Sonic Core app icon: a 90s metal shield in chrome, a
       chrome headset and a lightning bolt from ice blue to hot pink. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121426"/><stop offset="1" stop-color="#06070d"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".36" stop-color="#b8c2d6"/>
      <stop offset=".5" stop-color="#3a4257"/><stop offset=".57" stop-color="#e6ebf5"/>
      <stop offset="1" stop-color="#7a8499"/></linearGradient>
    <linearGradient id="chromeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7489"/><stop offset=".45" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#aeb8cc"/><stop offset="1" stop-color="#4a5266"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset=".3" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#b8c2d6"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f7ff"/><stop offset=".35" stop-color="#38bdf8"/>
      <stop offset=".7" stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".28" stop-color="#f472b6"/>
      <stop offset=".6" stop-color="#a855f7" stop-opacity=".55"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <path d="M128 22 L214 58 L204 150 L128 234 L52 150 L42 58z" fill="#0b0c16" stroke="url(#frame)" stroke-width="8" stroke-linejoin="miter"/>
  <path d="M128 36 L200 66 L191 145 L128 215 L65 145 L56 66z" fill="none" stroke="#2a2f45" stroke-width="2"/>
  <circle cx="128" cy="140" r="40" fill="url(#core)" filter="url(#glow)"/>
  <path d="M76 146 V122 a52 52 0 0 1 104 0 V146" fill="none" stroke="url(#chromeH)" stroke-width="12" stroke-linecap="square"/>
  <path d="M60 120 L90 116 L92 170 L62 174z" fill="url(#chrome)" stroke="#05060a" stroke-width="3"/>
  <path d="M196 120 L166 116 L164 170 L194 174z" fill="url(#chrome)" stroke="#05060a" stroke-width="3"/>
  <rect x="66" y="140" width="20" height="5" rx="2" fill="#38bdf8" filter="url(#glow)"/>
  <rect x="170" y="140" width="20" height="5" rx="2" fill="#f472b6" filter="url(#glow)"/>
  <path d="M146 62 L104 136 H128 L108 206 L160 120 H136 L156 62z" fill="url(#bolt)" stroke="#f0f9ff" stroke-width="2" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
