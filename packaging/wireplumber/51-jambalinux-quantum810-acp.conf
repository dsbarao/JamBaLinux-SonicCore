# Instalado pelo JamBaLinux SonicCore (overlay ACP do usuário).
#
# Troca apenas o profile-set ACP do card do JBL Quantum 810 Wireless pelo
# overlay instalado em ~/.config/alsa-card-profile/mixer. Não altera regras
# udev, HID, rotas nem o sink padrão. Remover este arquivo e reiniciar o
# WirePlumber volta ao profile-set upstream.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-Harman_International_Inc_JBL_Quantum810_Wireless-.*"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "jambalinux-quantum810.conf"
      }
    }
  }
]
